<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Quick Insight Icon - $199 -->
  <g id="quick-insight" transform="translate(50, 50)">
    <!-- Background circle -->
    <circle cx="75" cy="75" r="70" fill="#22c55e" stroke="#16a34a" stroke-width="3"/>
    
    <!-- Eye symbol for "insight" -->
    <ellipse cx="75" cy="65" rx="25" ry="15" fill="white"/>
    <circle cx="75" cy="65" r="8" fill="#16a34a"/>
    <circle cx="77" cy="63" r="3" fill="white"/>
    
    <!-- Lightning bolt for "quick" -->
    <path d="M65 85 L70 95 L75 90 L85 105 L80 95 L75 100 Z" fill="white"/>
    
    <!-- Price tag -->
    <rect x="95" y="10" width="40" height="20" rx="3" fill="white" stroke="#16a34a" stroke-width="2"/>
    <text x="115" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#16a34a">$199</text>
    
    <!-- Service name -->
    <text x="75" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Quick Insight</text>
    <text x="75" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Second Opinion</text>
  </g>

  <!-- Tactical Advisory Icon - $499 -->
  <g id="tactical-advisory" transform="translate(250, 50)">
    <!-- Background circle -->
    <circle cx="75" cy="75" r="70" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3"/>
    
    <!-- Compass/navigation symbol -->
    <circle cx="75" cy="75" r="30" fill="none" stroke="white" stroke-width="3"/>
    <path d="M75 50 L85 70 L75 75 L65 70 Z" fill="white"/>
    <path d="M75 100 L65 80 L75 75 L85 80 Z" fill="#1d4ed8"/>
    <path d="M50 75 L70 65 L75 75 L70 85 Z" fill="white"/>
    <path d="M100 75 L80 85 L75 75 L80 65 Z" fill="#1d4ed8"/>
    <circle cx="75" cy="75" r="4" fill="white"/>
    
    <!-- Price tag -->
    <rect x="95" y="10" width="40" height="20" rx="3" fill="white" stroke="#1d4ed8" stroke-width="2"/>
    <text x="115" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1d4ed8">$499</text>
    
    <!-- Service name -->
    <text x="75" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">Tactical Advisory</text>
    <text x="75" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Action Roadmap</text>
  </g>

  <!-- Executive Decision Kit Icon - $995 -->
  <g id="executive-decision" transform="translate(450, 50)">
    <!-- Background circle -->
    <circle cx="75" cy="75" r="70" fill="#8b5cf6" stroke="#7c3aed" stroke-width="3"/>
    
    <!-- Crown symbol for executive level -->
    <path d="M55 65 L60 55 L65 60 L70 50 L75 60 L80 50 L85 60 L90 55 L95 65 L90 75 L60 75 Z" fill="white"/>
    <circle cx="65" cy="58" r="2" fill="#7c3aed"/>
    <circle cx="75" cy="53" r="2" fill="#7c3aed"/>
    <circle cx="85" cy="58" r="2" fill="#7c3aed"/>
    
    <!-- Document stack beneath crown -->
    <rect x="60" y="78" width="30" height="20" rx="2" fill="white"/>
    <rect x="58" y="80" width="30" height="20" rx="2" fill="#e5e7eb" stroke="white" stroke-width="1"/>
    <rect x="56" y="82" width="30" height="20" rx="2" fill="white" stroke="#7c3aed" stroke-width="1"/>
    
    <!-- Price tag -->
    <rect x="95" y="10" width="40" height="20" rx="3" fill="white" stroke="#7c3aed" stroke-width="2"/>
    <text x="115" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7c3aed">$995</text>
    
    <!-- Service name -->
    <text x="75" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">Executive Decision Kit</text>
    <text x="75" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Boardroom Ready</text>
  </g>

  <!-- GenApex Brand Icon -->
  <g id="brand-icon" transform="translate(650, 50)">
    <!-- Hexagonal background -->
    <path d="M75 25 L105 45 L105 85 L75 105 L45 85 L45 45 Z" fill="#1f2937" stroke="#4b5563" stroke-width="2"/>
    
    <!-- Stylized "GA" monogram -->
    <path d="M55 50 L65 50 L70 65 L65 80 L55 80 L60 65 Z" fill="white"/>
    <path d="M85 50 L95 50 L95 80 L85 80 L85 65 L90 65" fill="white"/>
    <rect x="85" y="55" width="10" height="3" fill="white"/>
    
    <!-- Apex triangle -->
    <path d="M75 35 L80 45 L70 45 Z" fill="#22c55e"/>
    
    <!-- Service name -->
    <text x="75" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">GenApex</text>
    <text x="75" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Micro-Consulting</text>
  </g>

  <!-- Service Flow Arrow -->
  <g id="flow-arrow" transform="translate(50, 280)">
    <defs>
      <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
      </linearGradient>
    </defs>
    
    <path d="M50 50 L500 50" stroke="url(#arrowGradient)" stroke-width="4" fill="none"/>
    <path d="M480 40 L500 50 L480 60" stroke="#8b5cf6" stroke-width="4" fill="none"/>
    
    <!-- Flow labels -->
    <text x="150" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Fast</text>
    <text x="275" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Focused</text>
    <text x="425" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Future-Ready</text>
  </g>

  <!-- Key Benefits Icons -->
  <g id="benefits" transform="translate(50, 380)">
    <!-- Speed -->
    <g transform="translate(0, 0)">
      <circle cx="30" cy="30" r="25" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
      <path d="M20 30 L25 20 L30 25 L40 10 L35 20 L30 15 Z" fill="#22c55e"/>
      <text x="30" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#22c55e">SPEED</text>
      <text x="30" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Days not months</text>
    </g>
    
    <!-- Focus -->
    <g transform="translate(150, 0)">
      <circle cx="30" cy="30" r="25" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="30" cy="30" r="15" fill="none" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="30" cy="30" r="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="30" cy="30" r="3" fill="#3b82f6"/>
      <text x="30" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#3b82f6">FOCUS</text>
      <text x="30" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Targeted solutions</text>
    </g>
    
    <!-- Value -->
    <g transform="translate(300, 0)">
      <circle cx="30" cy="30" r="25" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
      <path d="M30 15 L35 25 L45 25 L37 32 L40 42 L30 37 L20 42 L23 32 L15 25 L25 25 Z" fill="#8b5cf6"/>
      <text x="30" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#8b5cf6">VALUE</text>
      <text x="30" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Maximum impact</text>
    </g>
    
    <!-- Experience -->
    <g transform="translate(450, 0)">
      <circle cx="30" cy="30" r="25" fill="#fef7ed" stroke="#f59e0b" stroke-width="2"/>
      <rect x="20" y="20" width="20" height="15" rx="2" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <path d="M25 20 L25 15 M35 20 L35 15" stroke="#f59e0b" stroke-width="2"/>
      <text x="30" y="23" font-family="Arial, sans-serif" font-size="6" text-anchor="middle" fill="#f59e0b" font-weight="bold">20+</text>
      <text x="30" y="30" font-family="Arial, sans-serif" font-size="5" text-anchor="middle" fill="#f59e0b">YEARS</text>
      <text x="30" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f59e0b">EXPERIENCE</text>
      <text x="30" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Proven expertise</text>
    </g>
  </g>

  <!-- Company tagline -->
  <text x="400" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Fast. Focused. Future-Ready.</text>
</svg>